# ==========================================================================
#  自动化流水线：代码推送到 main
#    1) 构建 Docker 镜像并推送到 GHCR（ghcr.io/<owner>/<repo>:latest + :sha）
#    2) SSH 登录服务器，上传部署脚本并执行：同步配置 → 拉镜像 → 滚动重启
#
#  需要在 GitHub 仓库 Settings → Secrets and variables → Actions 配置：
#    SSH_HOST         服务器 IP / 域名
#    SSH_USER         SSH 用户名（需有 docker 权限，如 ubuntu / root）
#    SSH_PORT         SSH 端口（默认 22，可不配）
#    SSH_PRIVATE_KEY  能登录服务器的私钥（与服务器 ~/.ssh/authorized_keys 配对）
#    DEPLOY_PATH      服务器部署目录，如 /opt/b2b-website
#    GHCR_USERNAME    GitHub 用户名（用于服务器 docker login ghcr.io）
#    GHCR_TOKEN       GitHub PAT，需 read:packages（私有仓库还需 repo）权限
#
#  首次部署：在服务器 DEPLOY_PATH 放好 .env（cp .env.example .env 后填写），
#  之后每次 git push 即全自动完成 更新配置 → 拉镜像 → 重启容器。
# ==========================================================================
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build image & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      IMAGE_NAME: ghcr.io/${{ github.repository }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      # 私有仓库也能克隆（PAT 具备 repo 权限时）；公开仓库同样可用
      REPO_URL: https://x-access-token:${{ secrets.GHCR_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deploy script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "scripts/deploy.sh"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Run deploy script on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,IMAGE_NAME,GHCR_USERNAME,GHCR_TOKEN,REPO_URL
          script: |
            set -e
            chmod +x "$DEPLOY_PATH/scripts/deploy.sh"
            bash "$DEPLOY_PATH/scripts/deploy.sh"
